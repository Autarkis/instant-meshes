name: Create Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_github_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

jobs:
  build-and-package:
    name: Build and Package Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Copy CMake wrapper configuration to root
      run: |
        copy CMakeLists_Wrapper.txt CMakeLists.txt
      shell: cmd

    - name: Patch TBB CMake version for compatibility
      run: |
        powershell -Command "(Get-Content ext\tbb\CMakeLists.txt) -replace 'cmake_minimum_required \(VERSION 2\.8\)', 'cmake_minimum_required (VERSION 3.10)' -replace 'cmake_minimum_required \(VERSION 3\.1\)', 'cmake_minimum_required (VERSION 3.10)' | Set-Content ext\tbb\CMakeLists.txt"
      shell: cmd

    - name: Configure CMake
      run: |
        cmake -B wrapper_build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: cmd

    - name: Build
      run: |
        cmake --build wrapper_build --config Release
      shell: cmd

    - name: Create package directory structure
      run: |
        mkdir release-package
        mkdir release-package\Plugins
        mkdir release-package\Plugins\x86_64
        mkdir release-package\Scripts
        mkdir release-package\Scripts\InstantMeshes
        mkdir release-package\Editor
        mkdir release-package\Documentation
      shell: cmd

    - name: Copy DLL and headers
      run: |
        copy wrapper_build\bin\instant_meshes_wrapper.dll release-package\Plugins\x86_64\
        copy wrapper_build\Release\instant_meshes_wrapper.lib release-package\Plugins\x86_64\
        copy src\instant_meshes_wrapper.h release-package\Plugins\
      shell: cmd

    - name: Copy Unity C# scripts
      run: |
        copy unity\Runtime\InstantMeshesAPI.cs release-package\Scripts\InstantMeshes\
        copy unity\Runtime\Example_BuildingMeshOptimizer.cs release-package\Scripts\InstantMeshes\
      shell: cmd

    - name: Copy documentation
      run: |
        copy UNITY_INTEGRATION.md release-package\Documentation\
        copy README_WRAPPER.md release-package\Documentation\
        copy LICENSE.txt release-package\Documentation\
      shell: cmd

    - name: Create DLL meta file for Unity
      run: |
        echo # Automatically configure DLL import settings > release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo fileFormatVersion: 2 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo guid: $(python -c "import uuid; print(str(uuid.uuid4()).replace('-',''))") >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo PluginImporter: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   externalObjects: {} >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   serializedVersion: 2 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   iconMap: {} >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   executionOrder: {} >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   defineConstraints: [] >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   isPreloaded: 0 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   isOverridable: 1 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   isExplicitlyReferenced: 0 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   validateReferences: 1 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   platformData: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   - first: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       Any: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo     second: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       enabled: 0 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       settings: {} >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   - first: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       Editor: Editor >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo     second: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       enabled: 0 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       settings: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo         CPU: x86_64 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo         DefaultValueInitialized: true >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   - first: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       Standalone: Win64 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo     second: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       enabled: 1 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo       settings: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo         CPU: x86_64 >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   userData: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   assetBundleName: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
        echo   assetBundleVariant: >> release-package\Plugins\x86_64\instant_meshes_wrapper.dll.meta
      shell: cmd

    - name: Create README for package
      run: |
        echo # Instant Meshes for Unity - ${{ github.event.inputs.version }} > release-package\README.md
        echo. >> release-package\README.md
        echo ## Installation >> release-package\README.md
        echo. >> release-package\README.md
        echo 1. Copy the entire contents of this package to your Unity project's Assets folder >> release-package\README.md
        echo 2. The DLL will be automatically configured for Windows x64 Standalone builds >> release-package\README.md
        echo 3. Add InstantMeshes namespace to your scripts: `using InstantMeshes;` >> release-package\README.md
        echo. >> release-package\README.md
        echo ## Quick Start >> release-package\README.md
        echo. >> release-package\README.md
        echo ```csharp >> release-package\README.md
        echo using InstantMeshes; >> release-package\README.md
        echo. >> release-package\README.md
        echo Mesh inputMesh = GetComponent^<MeshFilter^>^(^).mesh; >> release-package\README.md
        echo Mesh optimizedMesh = InstantMeshesAPI.OptimizeMesh^(inputMesh^); >> release-package\README.md
        echo ``` >> release-package\README.md
        echo. >> release-package\README.md
        echo ## Documentation >> release-package\README.md
        echo. >> release-package\README.md
        echo See Documentation/UNITY_INTEGRATION.md for complete API reference and examples. >> release-package\README.md
        echo. >> release-package\README.md
        echo ## Requirements >> release-package\README.md
        echo. >> release-package\README.md
        echo - Unity 2020.3 or newer >> release-package\README.md
        echo - Windows x64 platform >> release-package\README.md
        echo. >> release-package\README.md
        echo ## License >> release-package\README.md
        echo. >> release-package\README.md
        echo BSD-style license - See Documentation/LICENSE.txt >> release-package\README.md
      shell: cmd

    - name: Create version info file
      run: |
        echo { > release-package\version.json
        echo   "version": "${{ github.event.inputs.version }}", >> release-package\version.json
        echo   "build_date": "$(date +%%Y-%%m-%%d)", >> release-package\version.json
        echo   "commit": "${{ github.sha }}" >> release-package\version.json
        echo } >> release-package\version.json
      shell: cmd

    - name: Create zip archive
      run: |
        powershell -Command "Compress-Archive -Path release-package\* -DestinationPath InstantMeshes-Unity-${{ github.event.inputs.version }}-Windows-x64.zip"
      shell: cmd

    - name: Upload release package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: InstantMeshes-Unity-${{ github.event.inputs.version }}-Windows-x64
        path: InstantMeshes-Unity-${{ github.event.inputs.version }}-Windows-x64.zip
        if-no-files-found: error

    - name: Create GitHub Release
      if: ${{ github.event.inputs.create_github_release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Instant Meshes Unity Wrapper ${{ github.event.inputs.version }}
        body: |
          # Instant Meshes for Unity ${{ github.event.inputs.version }}

          High-quality quad-dominant mesh optimization for Unity.

          ## What's Included

          - `instant_meshes_wrapper.dll` - Native Windows x64 library
          - `InstantMeshesAPI.cs` - Unity C# wrapper
          - `Example_BuildingMeshOptimizer.cs` - Example component
          - Complete documentation

          ## Installation

          1. Download `InstantMeshes-Unity-${{ github.event.inputs.version }}-Windows-x64.zip`
          2. Extract to your Unity project's `Assets/` folder
          3. The DLL is pre-configured for Windows x64 Standalone

          ## Quick Start

          ```csharp
          using InstantMeshes;

          Mesh optimizedMesh = InstantMeshesAPI.OptimizeMesh(inputMesh);
          ```

          ## Requirements

          - Unity 2020.3+
          - Windows x64

          ## Documentation

          See `Documentation/UNITY_INTEGRATION.md` for complete API reference.

          ## Performance

          - Typical reduction: 50-80% triangles
          - Processing time: <1s for 20k triangles
          - Quad-dominant output ideal for architecture

          Built from commit: ${{ github.sha }}
        files: |
          InstantMeshes-Unity-${{ github.event.inputs.version }}-Windows-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
